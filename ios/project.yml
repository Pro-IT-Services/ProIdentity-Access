name: ProIdentity Access
options:
  bundleIdPrefix: com.proidentity
  xcodeVersion: "26.4"
  deploymentTarget:
    iOS: "17.0"

packages:
  WireGuardKit:
    path: Dependencies/wireguard-apple

settings:
  base:
    DEVELOPMENT_TEAM: L2JYD8UU7X
    SWIFT_VERSION: "5"
    # App version and build for the app and both extensions (the Info.plists
    # read these). Change them in Xcode (General > Identity) or here.
    MARKETING_VERSION: 0.7.12
    CURRENT_PROJECT_VERSION: 1
    # Xcode 26.4 recommended settings
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  ProIdentity Access:
    type: application
    platform: iOS
    # Shared scheme for the app, so Xcode doesn't auto-create one per target
    # (and select the PacketTunnel extension, which can't run on its own).
    scheme: {}
    sources:
      - ProIdentity
      - Shared
    settings:
      base:
        PRODUCT_NAME: ProIdentity Access
        PRODUCT_MODULE_NAME: ProIdentityAccess
        # iPhone and iPad only (no Mac or Apple Vision "Designed for iPad")
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.proidentity.access
        CODE_SIGN_ENTITLEMENTS: ProIdentity/ProIdentity.entitlements
        INFOPLIST_FILE: ProIdentity/Info.plist
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: PacketTunnel
        embed: true
      - target: ConnectionActivity
        embed: true

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - PacketTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.proidentity.access.tunnel
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Dependencies/wireguard-apple/Sources/WireGuardKitGo/out"
        # The simulator needs its own libwg-go build (see Dependencies setup).
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]":
          - "$(PROJECT_DIR)/Dependencies/wireguard-apple/Sources/WireGuardKitGo/out-sim"
    dependencies:
      - package: WireGuardKit
        product: WireGuardKit

  # Live Activity (lock screen + Dynamic Island) for a connected VPN.
  ConnectionActivity:
    type: app-extension
    platform: iOS
    sources:
      - ConnectionActivity
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.proidentity.access.activity
        INFOPLIST_FILE: ConnectionActivity/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
